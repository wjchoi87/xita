<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>XITA</title>
<script>
  // CSS 가 그려지기 전에 테마를 정해 깜빡임을 막는다 (localStorage 실패해도 시스템 테마로)
  (function () {
    var pref = 'system'
    try { var v = localStorage.getItem('xita.theme'); if (v === 'light' || v === 'dark') pref = v } catch (e) {}
    var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
    document.documentElement.setAttribute('data-theme-pref', pref)
  })()
</script>
<link rel="stylesheet" href="/app/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Cpath d='M10 10l12 12M22 10L10 22' stroke='white' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
<script type="module" src="/app/app.js"></script>
</head>
<body>
<a class="skip" href="#view">본문으로 건너뛰기</a>
<div class="app">
  <aside class="sidebar" aria-label="주 메뉴">
    <div class="side-top">
      <a class="brand" href="#/" aria-label="XITA 홈">
        <span class="brand-mark" aria-hidden="true">X</span>
        <span class="brand-text"><span class="brand-name">XITA</span><span class="brand-ws" id="ws-name"></span></span>
      </a>
      <button type="button" class="icon-btn nav-toggle" id="nav-toggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="side-nav">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <button type="button" class="side-search" data-action="palette" aria-label="명령 팔레트 열기 (⌘K)">

      <span>검색·이동</span><span class="spacer"></span><kbd>⌘K</kbd>
    </button>
    <nav class="side-nav" id="side-nav">
      <a class="nav-link" href="#/" data-route="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6 8 6v8a1 1 0 01-1 1h-4v-5h-6v5H5a1 1 0 01-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>홈</span></a>
      <a class="nav-link" href="#/projects" data-route="projects">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="13" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="13" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <span>프로젝트</span><span class="nav-count" id="badge-projects" hidden></span></a>
      <a class="nav-link" href="#/plan" data-route="plan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a6 6 0 00-3.5 10.9V17h7v-2.6A6 6 0 0012 3.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.5 20h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>기획</span></a>
      <a class="nav-link" href="#/promo" data-route="promo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3l6 4V6L7 10H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M16.5 9a4 4 0 010 6M19 6.5a7.5 7.5 0 010 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>홍보</span></a>
      <a class="nav-link" href="#/decide" data-route="decide">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 12.5l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>결정할 일</span><span class="nav-badge" id="badge-decide" hidden></span></a>
      <a class="nav-link" href="#/activity" data-route="activity">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h3.5l2.5-6 4 12 2.5-6H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>활동</span></a>
      <a class="nav-link" href="#/revenue" data-route="revenue">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V11M10 19V6M15 19v-5M20 19V9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>수익</span></a>
      <a class="nav-link" href="#/docs" data-route="docs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l4 4V20a.5.5 0 01-.5.5h-10.5A.5.5 0 016.5 20V4a.5.5 0 01.5-.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.5 12h5M9.5 15.5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>문서</span></a>
      <a class="nav-link" href="#/settings" data-route="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5v2.5M12 18v2.5M3.5 12H6M18 12h2.5M6 6l1.8 1.8M16.2 16.2L18 18M6 18l1.8-1.8M16.2 7.8L18 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>설정</span></a>
    </nav>
    <div class="side-bottom" id="theme-slot"></div>
  </aside>

  <main class="main">
    <div id="warnbar"></div>
    <div id="view" class="view" tabindex="-1">
      <div class="sk-wrap" aria-busy="true" aria-label="불러오는 중"><div class="sk sk-row"></div><div class="sk sk-row"></div><div class="sk sk-row"></div></div>
    </div>
  </main>
</div>

<div class="dock" aria-live="polite">
  <div id="toasts" class="toasts"></div>
  <section id="jobs" class="jobs" aria-label="실행 중인 작업" hidden></section>
</div>

<noscript><p style="padding:24px">XITA 콘솔은 JavaScript 가 필요합니다.</p></noscript>
</body>
</html>
