<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XITA 에이전트 흐름</title>
<style>
  /* 팔레트: visual-report와 같다. 색은 이 변수만 쓴다. */
  :root {
    color-scheme: light dark;
    --background: #ffffff; --foreground: #171717;
    --muted-foreground: #52525b; --muted: #f4f4f5;
    --surface-primary: #fafafa; --surface-secondary: #f4f4f5;
    --border: #e4e4e7;
    --chart-1: #0ea5e9; --chart-2: #14b8a6; --chart-3: #f59e0b;
    --chart-4: #a855f7; --chart-5: #f43f5e; --chart-6: #84cc16;
    --success: #10b981; --destructive: #ef4444;
    --radius: 10px; --font-sans: -apple-system, system-ui, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #171717; --foreground: #fafafa;
      --muted-foreground: rgba(250, 250, 250, .55); --muted: rgba(250, 250, 250, .1);
      --surface-primary: rgba(250, 250, 250, .06); --surface-secondary: rgba(250, 250, 250, .04);
      --border: rgba(250, 250, 250, .12);
    }
  }
  html { background: var(--background); color: var(--foreground); font: 14px/1.5 var(--font-sans); }
  body { margin: 0; }
  .page { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .lede { color: var(--muted-foreground); margin: 0 0 16px; }

  .scenarios { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--foreground); cursor: pointer; }
  .chip.exception { color: var(--destructive); }
  .chip[aria-pressed="true"] { background: var(--foreground); color: var(--background); border-color: var(--foreground); }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 13px; color: var(--muted-foreground); }
  .controls button { font: inherit; padding: 4px 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface-primary); color: var(--foreground); cursor: pointer; }
  .controls button:disabled { opacity: .4; cursor: default; }
  .controls select { font: inherit; background: var(--surface-primary); color: var(--foreground); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 8px; }
  .controls label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .counter { margin-left: auto; font-variant-numeric: tabular-nums; }

  .lanes { display: grid; gap: 0; margin-bottom: 4px; font-size: 12px; color: var(--muted-foreground); }
  .lanes div { padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lanes .data-head { color: var(--chart-4); }
  .stage { position: relative; }
  .stage svg { position: absolute; inset: 0; overflow: visible; }
  .lane-bg { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--border); }
  .lane-bg:first-child { border-left: 0; }
  .lane-bg.data-col { border-left: 1px dashed var(--border); background: color-mix(in oklab, var(--chart-4) 4%, transparent); }

  .edge { fill: none; stroke: var(--border); stroke-width: 1.5; }
  .edge.done { stroke: color-mix(in oklab, var(--chart-1) 60%, transparent); }
  .exception-mode .edge.done { stroke: color-mix(in oklab, var(--chart-5) 60%, transparent); }
  .arrowhead { fill: var(--muted-foreground); }
  .token { fill: var(--chart-1); }
  .exception-mode .token { fill: var(--chart-5); }
  .dlink { fill: none; stroke: color-mix(in oklab, var(--chart-4) 55%, transparent); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .packet { fill: var(--chart-4); }

  .step, .entity { position: absolute; box-sizing: border-box; padding: 6px 10px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--background); transition: opacity .3s ease-out, border-color .3s ease-out, background-color .3s ease-out; overflow: hidden; }
  .step { cursor: pointer; }
  .step .label, .entity .label { font-size: 13px; font-weight: 600; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .step .state, .entity .store { font-size: 11px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step.fail .label { color: var(--destructive); }
  .step.dim, .entity.dim { opacity: .25; }
  .step.visited { border-color: color-mix(in oklab, var(--chart-1) 45%, transparent); }
  .step.active { border-color: var(--chart-1); background: color-mix(in oklab, var(--chart-1) 12%, var(--background)); }
  .exception-mode .step.visited { border-color: color-mix(in oklab, var(--chart-5) 45%, transparent); }
  .exception-mode .step.active { border-color: var(--chart-5); background: color-mix(in oklab, var(--chart-5) 12%, var(--background)); }
  .entity { border-style: dashed; }
  .entity.touched { border-style: solid; border-color: var(--chart-4); background: color-mix(in oklab, var(--chart-4) 12%, var(--background)); }
  .entity .op { font-size: 11px; color: var(--chart-4); font-weight: 600; }
  .narrow .step, .narrow .entity { padding: 4px 6px; }
  .narrow .step .label, .narrow .entity .label { font-size: 12px; line-height: 1.3; -webkit-line-clamp: 3; }
  .narrow .step .state, .narrow .entity .store { display: none; }

  .panel { margin-top: 20px; padding: 16px; border-radius: var(--radius); background: var(--surface-primary); }
  .panel .where { font-size: 12px; color: var(--muted-foreground); }
  .panel .title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; margin: 2px 0 6px; }
  .panel .detail { margin: 0 0 10px; }
  .meta { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 13px; }
  .meta dt { color: var(--muted-foreground); }
  .meta dd { margin: 0; }
  .meta .risk { color: var(--destructive); }
  .meta .data { color: var(--chart-4); }
  .trigger { margin-top: 12px; font-size: 12px; color: var(--muted-foreground); }
  .note { margin-top: 24px; font-size: 12px; color: var(--muted-foreground); }
</style>
</head>
<body>
<main class="page">
  <h1 id="title"></h1>
  <p class="lede" id="summary"></p>
  <div class="scenarios" id="scenarios" role="group" aria-label="시나리오"></div>
  <div class="controls">
    <button id="prev" type="button">이전</button>
    <button id="play" type="button">재생</button>
    <button id="next" type="button">다음</button>
    <select id="speed" aria-label="속도">
      <option value="0.5">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="2">2x</option>
    </select>
    <label id="data-toggle-wrap"><input type="checkbox" id="data-toggle" checked> 데이터 흐름</label>
    <span class="counter" id="counter"></span>
  </div>
  <div class="lanes" id="lanes"></div>
  <div class="stage" id="stage"></div>
  <section class="panel" aria-live="polite">
    <div class="where" id="p-where"></div>
    <div class="title" id="p-title"></div>
    <p class="detail" id="p-detail"></p>
    <dl class="meta" id="p-meta"></dl>
    <div class="trigger" id="p-trigger"></div>
  </section>
  <p class="note" id="note"></p>
</main>

<script>
(() => {
  const data = JSON.parse(document.getElementById("flow-data").textContent);
  const $ = (id) => document.getElementById(id);
  const stage = $("stage");
  const NS = "http://www.w3.org/2000/svg";
  const ROW = 76, BOX = 58, GUTTER = 14, TRAVEL_MS = 700, PACKET_MS = 550, PAUSE_MS = 650;
  const OPS = { create: "생성", read: "조회", update: "수정", delete: "삭제", send: "전송" };
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const entities = Array.isArray(data.entities) ? data.entities : [];
  const hasData = entities.length > 0;
  const laneIndex = Object.fromEntries(data.lanes.map((l, i) => [l.id, i]));
  const laneLabel = Object.fromEntries(data.lanes.map((l) => [l.id, l.label]));
  const stepById = Object.fromEntries(data.steps.map((s) => [s.id, s]));
  const entityById = Object.fromEntries(entities.map((e) => [e.id, e]));
  const rowOf = Object.fromEntries(data.steps.map((s, i) => [s.id, i]));
  const opsOf = (step) => (Array.isArray(step.data) ? step.data.filter((d) => entityById[d.entity]) : []);

  let scenario = data.scenarios[0];
  let idx = 0;
  let playing = false;
  let busy = false;
  let timer = null;
  let showData = hasData;
  let rects = {};
  let erects = {};
  let segPaths = [];
  let linkLayer = null;
  let packetLayer = null;
  let token = null;
  let stepEls = {};
  let entityEls = {};

  document.title = data.title;
  $("title").textContent = data.title;
  $("summary").textContent = data.summary || "";
  $("note").textContent = data.note || "";
  if (!hasData) $("data-toggle-wrap").hidden = true;
  $("data-toggle").addEventListener("change", (e) => { showData = e.target.checked; layout(); });

  for (const sc of data.scenarios) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (sc.kind === "exception" ? " exception" : "");
    b.textContent = sc.label;
    b.dataset.id = sc.id;
    b.addEventListener("click", () => selectScenario(sc.id));
    $("scenarios").append(b);
  }

  function center(r) { return { x: r.x + r.w / 2, y: r.y + r.h / 2 }; }

  function edgePath(a, b) {
    const ca = center(a), cb = center(b);
    if (b.y > a.y) {
      const sy = a.y + a.h, ey = b.y;
      if (Math.abs(ca.x - cb.x) < 1) return `M${ca.x} ${sy}L${cb.x} ${ey}`;
      const my = ey - 8;
      return `M${ca.x} ${sy}L${ca.x} ${my}L${cb.x} ${my}L${cb.x} ${ey}`;
    }
    const gx = stage.clientWidth - GUTTER / 2;
    return `M${a.x + a.w} ${ca.y}L${gx} ${ca.y}L${gx} ${cb.y}L${b.x + b.w} ${cb.y}`;
  }

  function entityRows() {
    const firstUse = {};
    data.steps.forEach((s, i) => { for (const d of opsOf(s)) if (!(d.entity in firstUse)) firstUse[d.entity] = i; });
    const order = entities.map((e, i) => ({ id: e.id, want: firstUse[e.id] ?? data.steps.length + i }))
      .sort((a, b) => a.want - b.want);
    const rows = {};
    let next = 0;
    for (const e of order) { rows[e.id] = Math.max(e.want, next); next = rows[e.id] + 1; }
    return rows;
  }

  function header(cols) {
    const lanesEl = $("lanes");
    lanesEl.replaceChildren();
    lanesEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    lanesEl.style.paddingRight = GUTTER + "px";
    for (const lane of data.lanes) {
      const d = document.createElement("div");
      d.textContent = lane.label;
      lanesEl.append(d);
    }
    if (showData) {
      const d = document.createElement("div");
      d.className = "data-head";
      d.textContent = "데이터";
      lanesEl.append(d);
    }
  }

  function svgLayer(W, H) {
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("width", W);
    svg.setAttribute("height", H);
    svg.setAttribute("aria-hidden", "true");
    return svg;
  }

  function layout() {
    const W = stage.clientWidth;
    const cols = data.lanes.length + (showData ? 1 : 0);
    const laneW = (W - GUTTER) / cols;
    const eRows = showData ? entityRows() : {};
    const rowCount = Math.max(data.steps.length, ...Object.values(eRows).map((r) => r + 1), 1);
    const H = rowCount * ROW;
    header(cols);
    stage.classList.toggle("narrow", laneW < 96);
    stage.style.height = H + "px";
    stage.replaceChildren();
    rects = {};
    erects = {};
    stepEls = {};
    entityEls = {};

    for (let i = 0; i < cols; i++) {
      const bg = document.createElement("div");
      bg.className = "lane-bg" + (showData && i === cols - 1 ? " data-col" : "");
      bg.style.left = i * laneW + "px";
      bg.style.width = laneW + "px";
      stage.append(bg);
    }

    const svg = svgLayer(W, H);
    const defs = document.createElementNS(NS, "defs");
    defs.innerHTML = '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrowhead" d="M1 1L9 5L1 9z"/></marker>';
    svg.append(defs);

    for (const s of data.steps) {
      rects[s.id] = { x: laneIndex[s.lane] * laneW + 6, y: rowOf[s.id] * ROW + (ROW - BOX) / 2, w: laneW - 12, h: BOX };
    }
    if (showData) {
      for (const e of entities) {
        erects[e.id] = { x: data.lanes.length * laneW + 6, y: eRows[e.id] * ROW + (ROW - BOX) / 2, w: laneW - 12, h: BOX };
      }
    }

    linkLayer = document.createElementNS(NS, "g");
    svg.append(linkLayer);
    const edgeLayer = document.createElementNS(NS, "g");
    svg.append(edgeLayer);
    segPaths = [];
    for (let i = 0; i < scenario.path.length - 1; i++) {
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", edgePath(rects[scenario.path[i]], rects[scenario.path[i + 1]]));
      p.setAttribute("class", "edge");
      p.setAttribute("marker-end", "url(#ah)");
      edgeLayer.append(p);
      segPaths.push(p);
    }
    stage.append(svg);

    for (const s of data.steps) {
      const el = box("step" + (s.kind === "fail" ? " fail" : ""), rects[s.id], s.label, s.state, "state");
      el.addEventListener("click", () => {
        const at = scenario.path.indexOf(s.id);
        if (at >= 0) { stop(); idx = at; render(); pulseData(); }
      });
      stepEls[s.id] = el;
    }
    for (const e of entities) {
      if (!erects[e.id]) continue;
      const el = box("entity", erects[e.id], e.label, e.store, "store");
      const op = document.createElement("div");
      op.className = "op";
      el.append(op);
      entityEls[e.id] = el;
    }

    const top = svgLayer(W, H);
    packetLayer = document.createElementNS(NS, "g");
    top.append(packetLayer);
    token = document.createElementNS(NS, "circle");
    token.setAttribute("r", 6);
    token.setAttribute("class", "token");
    top.append(token);
    stage.append(top);
    render();
  }

  function box(cls, r, label, sub, subCls) {
    const el = document.createElement("div");
    el.className = cls;
    Object.assign(el.style, { left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px" });
    const l = document.createElement("div");
    l.className = "label";
    l.textContent = label;
    el.append(l);
    if (sub) {
      const s = document.createElement("div");
      s.className = subCls;
      s.textContent = sub;
      el.append(s);
    }
    stage.append(el);
    return el;
  }

  function linkPath(stepId, entityId) {
    const a = rects[stepId], b = erects[entityId];
    const sx = a.x + a.w, sy = a.y + a.h / 2, ex = b.x, ey = b.y + b.h / 2;
    const mx = (sx + ex) / 2;
    return `M${sx} ${sy}C${mx} ${sy},${mx} ${ey},${ex} ${ey}`;
  }

  function placeToken(x, y) {
    token.setAttribute("cx", x);
    token.setAttribute("cy", y);
  }

  function render() {
    const path = scenario.path;
    const seen = new Set(path.slice(0, idx + 1));
    const inScenario = new Set(path);
    const current = stepById[path[idx]];
    const currentOps = showData ? opsOf(current) : [];
    const scenarioEntities = new Set(path.flatMap((id) => opsOf(stepById[id]).map((d) => d.entity)));
    document.body.classList.toggle("exception-mode", scenario.kind === "exception");
    for (const [id, el] of Object.entries(stepEls)) {
      el.classList.toggle("dim", !inScenario.has(id));
      el.classList.toggle("visited", seen.has(id));
      el.classList.toggle("active", path[idx] === id);
    }
    for (const [id, el] of Object.entries(entityEls)) {
      const ops = currentOps.filter((d) => d.entity === id);
      el.classList.toggle("dim", !scenarioEntities.has(id));
      el.classList.toggle("touched", ops.length > 0);
      el.querySelector(".op").textContent = ops.map((d) => OPS[d.op] || d.op).join(" · ");
    }
    segPaths.forEach((p, i) => p.classList.toggle("done", i < idx));
    linkLayer.replaceChildren();
    for (const d of currentOps) {
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", linkPath(current.id, d.entity));
      p.setAttribute("class", "dlink");
      linkLayer.append(p);
    }
    const c = center(rects[path[idx]]);
    placeToken(c.x, c.y);

    for (const b of $("scenarios").children) b.setAttribute("aria-pressed", String(b.dataset.id === scenario.id));
    $("counter").textContent = `${idx + 1} / ${path.length}`;
    $("prev").disabled = idx === 0 || busy;
    $("next").disabled = idx >= path.length - 1 || busy;
    $("play").textContent = playing ? "일시정지" : idx >= path.length - 1 ? "다시 재생" : "재생";

    $("p-where").textContent = laneLabel[current.lane];
    $("p-title").textContent = current.label;
    $("p-detail").textContent = current.detail || "";
    const meta = $("p-meta");
    meta.replaceChildren();
    const rows = [["state", "상태"], ["money", "돈"], ["risk", "주의"]].filter(([k]) => current[k]).map(([k, name]) => [name, current[k], k]);
    const dataText = opsOf(current).map((d) => `${OPS[d.op] || d.op} ${entityById[d.entity].label}${d.fields?.length ? ` (${d.fields.join(", ")})` : ""}`).join(" / ");
    if (dataText) rows.splice(1, 0, ["데이터", dataText, "data"]);
    for (const [name, value, cls] of rows) {
      const dt = document.createElement("dt");
      dt.textContent = name;
      const dd = document.createElement("dd");
      dd.textContent = value;
      if (cls === "risk" || cls === "data") dd.className = cls;
      meta.append(dt, dd);
    }
    $("p-trigger").textContent = scenario.trigger ? `시나리오 조건: ${scenario.trigger}` : "";
  }

  function speed() { return Number($("speed").value) || 1; }

  function pulseData(done) {
    const step = stepById[scenario.path[idx]];
    const ops = showData ? opsOf(step) : [];
    if (reduceMotion || !ops.length) { done?.(); return; }
    const links = [...linkLayer.children];
    const packets = ops.map(() => {
      const r = document.createElementNS(NS, "rect");
      r.setAttribute("width", 8);
      r.setAttribute("height", 8);
      r.setAttribute("rx", 2);
      r.setAttribute("class", "packet");
      packetLayer.append(r);
      return r;
    });
    const dur = PACKET_MS / speed();
    const start = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - start) / dur);
      const e = 1 - Math.pow(1 - t, 3);
      ops.forEach((d, i) => {
        const link = links[i];
        if (!link) return;
        const len = link.getTotalLength();
        const pos = d.op === "read" ? 1 - e : e;
        const pt = link.getPointAtLength(len * pos);
        packets[i].setAttribute("x", pt.x - 4);
        packets[i].setAttribute("y", pt.y - 4);
      });
      if (t < 1) { requestAnimationFrame(tick); return; }
      packets.forEach((p) => p.remove());
      done?.();
    };
    requestAnimationFrame(tick);
  }

  function advance(done) {
    if (idx >= scenario.path.length - 1) { done?.(); return; }
    const seg = segPaths[idx];
    if (reduceMotion || !seg) { idx++; render(); done?.(); return; }
    busy = true;
    render();
    const len = seg.getTotalLength();
    const dur = TRAVEL_MS / speed();
    const start = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - start) / dur);
      const e = 1 - Math.pow(1 - t, 3);
      const pt = seg.getPointAtLength(len * e);
      placeToken(pt.x, pt.y);
      if (t < 1) { requestAnimationFrame(tick); return; }
      idx++;
      render();
      pulseData(() => { busy = false; render(); done?.(); });
    };
    requestAnimationFrame(tick);
  }

  function loop() {
    if (!playing) return;
    if (idx >= scenario.path.length - 1) { playing = false; render(); return; }
    advance(() => { timer = setTimeout(loop, PAUSE_MS / speed()); });
  }

  function stop() {
    playing = false;
    clearTimeout(timer);
    render();
  }

  function selectScenario(id) {
    stop();
    scenario = data.scenarios.find((s) => s.id === id) || data.scenarios[0];
    idx = 0;
    layout();
  }

  $("play").addEventListener("click", () => {
    if (playing) { stop(); return; }
    if (idx >= scenario.path.length - 1) idx = 0;
    playing = true;
    render();
    pulseData(() => { timer = setTimeout(loop, PAUSE_MS / speed()); });
  });
  $("next").addEventListener("click", () => { stop(); if (!busy) advance(); });
  $("prev").addEventListener("click", () => { stop(); if (!busy && idx > 0) { idx--; render(); } });
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("select, input")) return;
    if (e.key === "ArrowRight") $("next").click();
    if (e.key === "ArrowLeft") $("prev").click();
    if (e.key === " ") { e.preventDefault(); $("play").click(); }
  });

  layout();
  let lastW = stage.clientWidth;
  new ResizeObserver(() => {
    if (stage.clientWidth === lastW) return;
    lastW = stage.clientWidth;
    layout();
  }).observe(stage);
  if (!reduceMotion) { playing = true; render(); setTimeout(() => pulseData(() => { timer = setTimeout(loop, PAUSE_MS / speed()); }), 400); }
})();
</script>
