services:
  postgres:
    image: postgres:17
    container_name: xita-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: xita
      POSTGRES_PASSWORD: xita
      POSTGRES_DB: xita
    ports:
      - '9543:5432'
    volumes:
      - xita_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xita -d xita']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  xita_pgdata: